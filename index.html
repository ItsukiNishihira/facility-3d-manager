<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Facility 3D Manager</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0c111b;color:#eef3fa;overflow:hidden}
#app{height:100vh;height:100dvh;display:grid;grid-template-rows:64px 1fr}
header{display:flex;align-items:center;gap:12px;padding:10px 14px;background:#121a28;border-bottom:1px solid #263247}
.logo{font-weight:800}.sub{font-size:12px;color:#9fb0c8}.spacer{flex:1}
button,select,input,textarea{font:inherit}.btn{background:#1c2a40;color:#fff;border:1px solid #344761;border-radius:10px;padding:9px 12px}
main{display:grid;grid-template-columns:260px 1fr 310px;min-height:0}
aside{background:#111927;padding:14px;overflow:auto}.left{border-right:1px solid #263247}.right{border-left:1px solid #263247}
h3{margin:8px 0 12px;font-size:14px}.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px}.card{background:#182235;border:1px solid #26364f;border-radius:12px;padding:11px;margin-bottom:10px}
.big{font-size:24px;font-weight:800}.muted{color:#9fb0c8;font-size:12px}.legend{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:13px}.dot{width:10px;height:10px;border-radius:50%}
#view{position:relative;min-width:0;background:linear-gradient(#172335,#0e1521)}
canvas{display:block;width:100%;height:100%;touch-action:none}.toolbar{position:absolute;top:12px;left:12px;display:flex;gap:7px;flex-wrap:wrap}
.tip{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:#0b111bcc;padding:8px 12px;border-radius:10px;font-size:12px}
.roomrow{display:flex;justify-content:space-between;align-items:center;padding:8px;border-bottom:1px solid #263247;cursor:pointer}.roomrow:hover{background:#1a2639}
#roomPhoto{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;border:1px solid #26364f;display:block;margin-bottom:8px}.photoBtns{display:flex;gap:8px;margin-bottom:4px}.small{font-size:12px;padding:6px 10px;cursor:pointer}.roomrow.active{background:#243553;box-shadow:inset 3px 0 #58a7ff}.menuBtn{display:none}.closeBtn{display:none}.tipTouch{display:none}.badge{font-size:11px;padding:3px 7px;border-radius:12px;background:#26364f}
label{display:block;font-size:12px;color:#9fb0c8;margin:10px 0 4px}select,input,textarea{width:100%;background:#0d1522;color:white;border:1px solid #35445d;border-radius:8px;padding:8px}textarea{height:68px}
@media(max-width:850px){main{grid-template-columns:1fr}.left{display:none;position:absolute;left:8px;top:76px;width:230px;max-height:calc(100vh - 90px);z-index:5;border:1px solid #33435d;border-radius:12px}.left.open{display:block}.menuBtn{display:inline-block!important}main{grid-template-rows:minmax(0,1fr)}main.roomOpen{grid-template-rows:minmax(0,45fr) minmax(0,55fr)}.right{display:none;border-left:0;border-top:1px solid #33435d;border-radius:16px 16px 0 0;padding-bottom:calc(14px + env(safe-area-inset-bottom))}main.roomOpen .right{display:block}main.roomOpen .tip{display:none}#roomPhoto{aspect-ratio:16/9;max-height:150px}.right h3{display:flex;justify-content:space-between;align-items:center}.closeBtn{display:inline-block}.tipMouse{display:none}.tipTouch{display:inline}.tip{bottom:auto;top:56px;white-space:nowrap}.left{max-height:calc(100dvh - 90px)}.btn{padding:10px 12px}.logo{font-size:14px}.sub{display:none}}
</style></head>
<body><div id="app">
<header><div><div class="logo">FACILITY 3D MANAGER</div><div class="sub">ホテル清掃・ビルメンテナンス統合管理</div></div><div class="spacer"></div><button class="btn menuBtn" onclick="document.querySelector('.left').classList.toggle('open')">客室一覧</button><button class="btn" onclick="resetView()">全景</button></header>
<main>
<aside class="left"><h3>本日の進捗</h3><div class="stat">
<div class="card"><div class="big" id="done">0</div><div class="muted">清掃完了</div></div>
<div class="card"><div class="big" id="issues">0</div><div class="muted">要確認</div></div></div>
<div class="card"><div class="muted" id="total">全36室</div><div id="progress" style="height:8px;background:#27354a;border-radius:9px;margin-top:8px"><div id="bar" style="height:100%;width:0;background:#62d38a;border-radius:9px"></div></div></div>
<h3>表示</h3><select id="floorSel" onchange="applyFloor()"><option value="all">全館</option><option value="5">5F</option><option value="4">4F</option><option value="3">3F</option><option value="2">2F</option></select>
<h3>ステータス</h3>
<div class="legend"><i class="dot" style="background:#73839b"></i>未清掃</div><div class="legend"><i class="dot" style="background:#f2b84b"></i>清掃中</div><div class="legend"><i class="dot" style="background:#4dcc7d"></i>清掃完了</div><div class="legend"><i class="dot" style="background:#58a7ff"></i>点検済</div><div class="legend"><i class="dot" style="background:#ef6464"></i>要確認</div>
<h3>客室一覧</h3><div id="roomList"></div></aside>
<section id="view"><div class="toolbar"><button class="btn" onclick="setMode('rooms')">客室</button><button class="btn" onclick="setMode('equipment')">設備</button><button class="btn" onclick="explode()">階層展開</button></div><canvas id="c"></canvas><div class="tip"><span class="tipMouse">ドラッグ：回転　ホイール：拡大縮小　客室をクリック：業務情報</span><span class="tipTouch">スワイプ：回転　ピンチ：拡大縮小　タップ：客室情報</span></div></section>
<aside class="right"><h3>選択情報<button class="btn small closeBtn" onclick="closeRoom()">閉じる</button></h3><div id="empty" class="card muted">3D建物または客室一覧から部屋を選択してください。</div>
<div id="editor" style="display:none"><div class="card"><b id="roomTitle" style="font-size:20px"></b><div class="muted" id="roomMeta"></div></div>
<img id="roomPhoto" alt="客室写真"><div class="photoBtns"><label class="btn small" for="photoFile">写真を変更</label><button class="btn small" onclick="resetPhoto()">サンプルに戻す</button><input type="file" id="photoFile" accept="image/*" hidden onchange="loadPhoto(this)"></div>
<label>清掃ステータス</label><select id="roomStatus" onchange="saveRoom()"><option>未清掃</option><option>清掃中</option><option>清掃完了</option><option>点検済</option><option>要確認</option></select>
<label>重点清掃箇所</label><textarea id="focusArea" placeholder="例：浴室の水垢、ベッド下のホコリ" oninput="saveRoom(true)"></textarea>
<label>修理必要箇所</label><textarea id="repairArea" placeholder="例：洗面台の排水が遅い" oninput="saveRoom(true)"></textarea></div></aside>
</main></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const statuses={'未清掃':0x73839b,'清掃中':0xf2b84b,'清掃完了':0x4dcc7d,'点検済':0x58a7ff,'要確認':0xef6464};
// 建物外観（reference/全体画像.png）準拠：1Fはピロティ駐車場、2F〜5Fは各階9室・南面バルコニー
const FLOORS=[2,3,4,5],PER=9,BW=1.6,FH=1.1,GH=1.35,LIFT=.45,X0=-PER*BW/2;
const ids=[];FLOORS.forEach(f=>{for(let n=1;n<=PER;n++)ids.push(`${f}${String(n).padStart(2,'0')}`)});
let saved=JSON.parse(localStorage.getItem('facilityRooms')||'null')||{},data={};ids.forEach(id=>data[id]=saved[id]||{status:'未清掃'});
let selected=null, mode='rooms', exploded=false;
const canvas=document.getElementById('c'),scene=new THREE.Scene();scene.background=new THREE.Color(0x111a28);

const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));

  let wm=new THREE.MeshBasicMaterial({color:statuses[data[id].status]}),win=new THREE.Mesh(new THREE.PlaneGeometry(.95,.72),wm),door=new THREE.Mesh(new THREE.PlaneGeometry(.38,.75),wm);
  win.position.set(-.1,-.06,1.201);door.position.set(.3,-.05,-1.201);door.rotation.y=Math.PI;m.add(win,door);m.userData.win=win;

box(.9,.6,.7,M.eq,X0+1.5*BW,.45,-.5,roof);box(.05,1.3,.05,M.eq,X0+6.6*BW,.8,-1.4,roof);
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();
let drag=false,px=0,py=0,sx=0,sy=0,ry=-.55,rx=.12,dist=1,ryT=null;
const pts=new Map();let pinch0=0,dist0=1;
const pinchLen=()=>{let [a,b]=[...pts.values()];return Math.hypot(a.x-b.x,a.y-b.y)};
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});ryT=null;

function selectRoom(id){document.querySelector('.left').classList.remove('open');document.querySelector('main').classList.add('roomOpen');selected=id;let d=data[id];empty.style.display='none';editor.style.display='block';roomTitle.textContent=id+'号室';roomMeta.textContent=id[0]+'階・客室';roomStatus.value=d.status;roomPhoto.src=d.photo||SAMPLE;focusArea.value=d.focus||'';repairArea.value=d.repair||'';renderList();highlight();if(Math.cos(ry)<0)ryT=ry+Math.PI;}
function closeRoom(){document.querySelector('main').classList.remove('roomOpen');selected=null;empty.style.display='block';editor.style.display='none';highlight();renderList()}
function saveRoom(keepList){if(!selected)return;let o=data[selected];data[selected]={status:roomStatus.value,focus:focusArea.value,repair:repairArea.value,photo:o.photo||''};try{localStorage.setItem('facilityRooms',JSON.stringify(data))}catch(e){alert('保存容量を超えました。写真を小さくしてください。')}refresh()}
function loadPhoto(inp){let fl=inp.files[0],id=selected;if(!fl||!id)return;let img=new Image();img.onload=()=>{let k=Math.min(1,800/Math.max(img.width,img.height)),cv=document.createElement('canvas');cv.width=img.width*k;cv.height=img.height*k;cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);data[id].photo=cv.toDataURL('image/jpeg',.8);try{localStorage.setItem('facilityRooms',JSON.stringify(data))}catch(e){alert('保存容量を超えました。写真を小さくしてください。')}if(id===selected){roomPhoto.src=data[id].photo;saveRoom()}inp.value=''};img.src=URL.createObjectURL(fl)}
function resetPhoto(){if(!selected)return;data[selected].photo='';roomPhoto.src=SAMPLE;saveRoom()}
function flagIssue(){roomStatus.value='要確認';saveRoom()}
function refresh(){rooms.forEach(m=>m.userData.win.material.color.setHex(statuses[data[m.userData.id].status]));let vals=Object.values(data);let d=vals.filter(x=>x.status==='清掃完了'||x.status==='点検済').length,i=vals.filter(x=>x.status==='要確認').length;done.textContent=d;issues.textContent=i;bar.style.width=(d/ids.length*100)+'%';total.textContent=`全${ids.length}室`;renderList()}
function renderList(){let f=floorSel.value;roomList.innerHTML='';Object.keys(data).filter(id=>f==='all'||id[0]===f).forEach(id=>{let el=document.createElement('div');el.className='roomrow';el.className='roomrow'+(id===selected?' active':'');el.innerHTML=`<span>${id}号室${data[id].repair?' 🔧':''}</span><span class="badge">${data[id].status}</span>`;el.onclick=()=>selectRoom(id);roomList.appendChild(el)})}
function applyFloor(){let f=floorSel.value;floors.forEach(g=>g.visible=f==='all'||String(g.userData.floor)===f);renderList()}
function explode(){exploded=!exploded}
function setMode(x){mode=x;if(x==='equipment'){rooms.forEach(m=>{m.material.opacity=.32;m.material.transparent=true});M.ac.color.setHex(0xef6464);M.eq.color.setHex(0xef6464)}else{rooms.forEach(m=>{m.material.opacity=1;m.material.transparent=false});M.ac.color.setHex(0xe6e6e1);M.eq.color.setHex(0x9aa3ad)}}
function resetView(){ry=-.55;rx=.12;dist=1;floorSel.value='all';applyFloor()}
function resize(){let w=canvas.clientWidth,h=canvas.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
function loop(){resize();if(ryT!==null){let d=ryT-ry;ry+=d*.1;if(Math.abs(d)<.003){ry=ryT;ryT=null}}building.rotation.y=ry;building.rotation.x=rx;let fit=Math.max(1,1.08/camera.aspect);camera.position.set(0,7*fit,21.5*dist*fit);camera.lookAt(0,3,0);floors.forEach(g=>{let t=g.userData.baseY+(exploded?(g.userData.floor-2)*LIFT:0);g.position.y+=(t-g.position.y)*.08});renderer.render(scene,camera);requestAnimationFrame(loop)}refresh();loop();
</script></body></html>
