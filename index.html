<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Facility 3D Manager</title>
<meta name="description" content="全店舗の設備修繕を写真付きで3Dモデル上に記録・共有し、本社で一括管理する">
<meta name="theme-color" content="#121a28">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="修繕3D">
<style>
:root{--bg:#0c111b;--panel:#111927;--card:#182235;--line:#263247;--line2:#35445d;--text:#eef3fa;--muted:#9fb0c8;--accent:#2f6fd6;
 --red:#e5484d;--yellow:#f2c230;--blue:#3b82f6;--gray:#8b95a3;--green:#3fae5a}
*{box-sizing:border-box}html,body{height:100%}[hidden]{display:none!important}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Segoe UI",sans-serif;background:var(--bg);color:var(--text);overflow:hidden;-webkit-text-size-adjust:100%}
button,select,input,textarea{font:inherit;color:inherit}
.btn{background:#1c2a40;color:#fff;border:1px solid #344761;border-radius:10px;padding:8px 12px;cursor:pointer;white-space:nowrap}
.btn:disabled{opacity:.5;cursor:default}.btn.primary{background:var(--accent);border-color:var(--accent)}.btn.danger{background:#5a1f24;border-color:#8a2f36}
.btn.small{font-size:12px;padding:6px 10px}
select,input,textarea{width:100%;background:#0d1522;border:1px solid var(--line2);border-radius:8px;padding:8px}textarea{min-height:64px;resize:vertical}
input[type=checkbox]{width:auto}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.muted{color:var(--muted);font-size:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
h2{font-size:18px;margin:4px 0 14px}h3{margin:6px 0 10px;font-size:14px}
#app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto 1fr;grid-template-columns:minmax(0,1fr)}
header{background:#121a28;border-bottom:1px solid var(--line);padding:8px 14px calc(0px) 14px;padding-top:max(8px,env(safe-area-inset-top))}
.hrow{display:flex;align-items:center;gap:10px}.logo{font-weight:800;letter-spacing:.02em;white-space:nowrap}.spacer{flex:1}
#storeSel{width:auto;min-width:0;flex:0 1 auto;max-width:260px;background:#1c2a40;border-color:#344761;border-radius:10px}
#userName{font-size:12px;color:var(--muted)}
nav{display:flex;gap:4px;overflow-x:auto;margin-top:6px;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:8px 12px;cursor:pointer;white-space:nowrap}
nav button.on{color:#fff;border-bottom-color:#58a7ff}
main{min-height:0;position:relative}
.page{position:absolute;inset:0;overflow:auto;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.page[hidden]{display:none}
/* 3D */
#modelPage{padding:0;display:grid;grid-template-columns:1fr 360px;overflow:hidden}
#view{position:relative;min-width:0;background:linear-gradient(#172335,#0e1521)}
canvas{display:block;width:100%;height:100%;touch-action:none}
.toolbar{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap}.toolbar select{width:auto;background:#1c2a40;border-color:#344761;border-radius:10px}
.legend{position:absolute;left:10px;bottom:10px;display:flex;gap:8px;flex-wrap:wrap;background:#0b111bcc;padding:6px 10px;border-radius:10px;font-size:11px}
.legend span{display:inline-flex;align-items:center;gap:4px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
#panel{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
#sheetGrip{display:none;justify-content:center;align-items:center;height:22px;background:var(--panel);border:0;border-top:1px solid var(--line2);border-radius:16px 16px 0 0;cursor:pointer;touch-action:none;padding:0;width:100%}
#sheetGrip::before{content:'';width:42px;height:5px;border-radius:3px;background:var(--line2)}
.panelHead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:#0d1522;border:1px solid var(--line2);white-space:nowrap}
.c-red{--c:var(--red)}.c-yellow{--c:var(--yellow)}.c-blue{--c:var(--blue)}.c-gray{--c:var(--gray)}.c-green{--c:var(--green)}
.chip.c-red,.chip.c-yellow,.chip.c-blue,.chip.c-gray,.chip.c-green{border-color:var(--c)}.chip .dot{background:var(--c)}
.case{display:grid;grid-template-columns:84px 1fr;gap:10px;align-items:start;cursor:pointer}
.case:hover{border-color:#3a5070}
.frame{width:84px;aspect-ratio:1;object-fit:cover;border-radius:8px;border:4px solid var(--c,#35445d);background:#0d1522;display:block;color:transparent}
.caseBody{min-width:0;font-size:13px}.caseBody b{display:block;margin:4px 0 2px}.caseBody .muted{line-height:1.5}
.areaBtns{display:flex;flex-wrap:wrap;gap:6px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}
/* 表 */
.tableWrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;font-weight:600;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line2);white-space:nowrap;background:#131d2d;position:sticky;top:0}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
tbody tr.click{cursor:pointer}tbody tr.click:hover{background:#1a2639}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}.filters label{margin-top:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c,var(--line2));border-radius:12px;padding:12px}
.tile .n{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.cnt{display:inline-block;min-width:28px;text-align:center;border-radius:6px;padding:2px 6px;font-weight:700}
.cnt.on{background:color-mix(in srgb,var(--c) 25%,transparent);color:#fff}.cnt.off{color:#4b5b72}
/* カレンダー */
.calHead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}.calHead b{font-size:16px;min-width:120px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
.cal .dow{font-size:11px;color:var(--muted);text-align:center;padding:6px 0;border-bottom:1px solid var(--line)}
.cal .day{min-height:96px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;min-width:0}
.cal .day:nth-child(7n){border-right:0}.cal .day.other{opacity:.45}.cal .day.today .dnum{background:var(--accent);color:#fff}
.cal.week .day{min-height:300px}
.dnum{font-size:11px;display:inline-block;padding:1px 6px;border-radius:999px;margin-bottom:3px}
.ev{display:block;width:100%;text-align:left;font-size:11px;padding:3px 5px;margin-bottom:3px;border-radius:5px;border:0;border-left:3px solid var(--c);background:#1c2a40;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
/* ダイアログ */
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line2);border-radius:16px;padding:0;width:min(640px,calc(100vw - 24px));max-height:calc(100dvh - 24px)}
dialog::backdrop{background:#000a}
.dlg{padding:16px;overflow:auto;max-height:calc(100dvh - 26px)}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px}.photos figure{margin:0}.photos img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;border:4px solid var(--c,#35445d);background:#0d1522;display:block;color:transparent}
.photos figcaption{font-size:11px;color:var(--muted);margin-top:4px}.noPhoto{aspect-ratio:4/3;border:2px dashed var(--line2);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);text-align:center;padding:8px}
dl.info{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin:14px 0}dl.info dt{color:var(--muted)}dl.info dd{margin:0}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#0b111bf0;border:1px solid var(--line2);padding:10px 16px;border-radius:12px;font-size:13px;z-index:100;display:none;max-width:calc(100vw - 32px)}
/* ログイン */
.gate{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:#0c111bf2;padding:16px}
.gate form,.gate .box{width:100%;max-width:360px;background:#121a28;border:1px solid var(--line);border-radius:16px;padding:22px}
.gate .btn{width:100%;margin-top:16px}
@media(max-width:850px){
 #storeSel{flex:1 1 auto;max-width:none}#userName{display:none}.hrow .spacer{display:none}.hrow{gap:6px}.logo{font-size:14px}
 #modelPage{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr)}
 /* 詳細は画面下 1/3。つまみをタップ／スワイプで 2/3 まで広げられる */
 #modelPage.open{grid-template-rows:minmax(0,2fr) auto minmax(0,1fr)}
 #modelPage.open.full{grid-template-rows:minmax(0,1fr) auto minmax(0,2fr)}
 #panel{display:none;border-left:0;padding-top:0}
 #modelPage.open #panel{display:block}#modelPage.open .legend{display:none}
 #modelPage.open #sheetGrip{display:flex}
 #panel .panelHead{position:sticky;top:0;z-index:2;background:var(--panel);padding:2px 0 6px}
 #panel .panelHead h3{margin:0}
 .page{padding:12px}
 .cal .day{min-height:64px;padding:2px}.cal.week .day{min-height:200px}.ev{font-size:10px;padding:2px 3px}
 .photos{grid-template-columns:1fr}
}
</style></head>
<body>
<div id="loginGate" class="gate"><form id="loginForm"><div class="logo">FACILITY 3D MANAGER</div><div class="muted" style="margin-top:4px">設備修繕の記録・共有</div>
<label for="loginEmail">メールアドレス</label><input id="loginEmail" type="email" autocomplete="username" required>
<label for="loginPass">パスワード</label><input id="loginPass" type="password" autocomplete="current-password" required>
<button class="btn primary" type="submit">ログイン</button><div id="loginMsg" class="muted" style="min-height:18px;margin-top:10px"></div>
<div class="muted">LINEログインは準備中です。</div></form></div>
<div id="pendingGate" class="gate" hidden><div class="box"><div class="logo">FACILITY 3D MANAGER</div>
<p>アカウントは作成済みです。本社管理者が有効化すると使えるようになります。</p><div class="muted" id="pendingEmail"></div>
<button class="btn" id="pendingLogout" type="button">ログアウト</button></div></div>

<div id="app" hidden>
<header><div class="hrow"><div class="logo">修繕3D</div><select id="storeSel" aria-label="店舗"></select><div class="spacer"></div><span id="userName"></span><button class="btn small" id="reloadBtn" title="最新の情報に更新">更新</button><button class="btn small" id="logoutBtn">ログアウト</button></div>
<nav id="tabs"><button data-view="model" class="on">3Dモデル</button><button data-view="dashboard" data-admin>ダッシュボード</button><button data-view="list">修繕一覧</button><button data-view="calendar" data-admin>カレンダー</button><button data-view="admin" data-admin>管理</button></nav></header>
<main>
<section class="page" id="modelPage">
 <div id="view"><div class="toolbar"><button class="btn small" id="homeBtn">全景</button><button class="btn small" id="explodeBtn">階層展開</button><select id="floorSel" aria-label="表示階"></select><button class="btn small" id="exitRoomBtn" style="display:none">← 建物に戻る</button></div>
  <canvas id="c"></canvas><div class="legend" id="legend"></div></div>
 <button id="sheetGrip" type="button" aria-label="詳細の表示サイズを切り替え"></button>
 <aside id="panel"></aside>
</section>
<section class="page" id="dashboardPage" hidden></section>
<section class="page" id="listPage" hidden></section>
<section class="page" id="calendarPage" hidden></section>
<section class="page" id="adminPage" hidden></section>
</main></div>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/building.js"></script>
<script src="js/app.js"></script>
</body></html>
